<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Warm Celebration Tabletop Canvas Gradient -->
    <linearGradient id="tableGrad_mc015" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241510" />
      <stop offset="50%" stop-color="#1c0f0a" />
      <stop offset="100%" stop-color="#120805" />
    </linearGradient>

    <!-- Candle Flame Warm Glow -->
    <radialGradient id="candleGlow_mc015" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1" />
      <stop offset="25%" stop-color="#ffd56b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f57c2a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1c0f0a" stop-opacity="0" />
    </radialGradient>

    <!-- Vintage Cream Frosting Gradient -->
    <linearGradient id="frosting_mc015" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf4e8" />
      <stop offset="60%" stop-color="#eddcc6" />
      <stop offset="100%" stop-color="#dbcaa8" />
    </linearGradient>

    <pattern id="grain_mc015" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#tableGrad_mc015)" />

  <!-- Wood Table Surface -->
  <line x1="0" y1="360" x2="900" y2="360" stroke="#3b2014" stroke-width="2" />
  <line x1="0" y1="460" x2="900" y2="460" stroke="#0a0402" stroke-width="2" />

  <!-- Candle Light Radial Beam -->
  <circle cx="340" cy="170" r="280" fill="url(#candleGlow_mc015)" />

  <!-- Composition: Vintage Tiered Cake, Candle, Propped Card & Flowers -->
  <g transform="translate(180, 100)">
    <!-- Propped Vintage Greeting Card in Background (Right) -->
    <g transform="translate(260, 40) rotate(8)">
      <rect x="8" y="8" width="180" height="220" rx="3" fill="#080402" opacity="0.5" />
      <rect x="0" y="0" width="180" height="220" rx="3" fill="#f7efe1" stroke="#bda682" stroke-width="1.5" />
      <rect x="8" y="8" width="164" height="204" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="4 2" />
      <!-- Handwritten Happy Birthday script lines -->
      <text x="90" y="55" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" fill="#691a24" letter-spacing="1">HAPPY</text>
      <text x="90" y="80" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#8c1b26">Birthday</text>
      <line x1="40" y1="95" x2="140" y2="95" stroke="#d4af37" stroke-width="1" />
      <!-- Poetic script lines -->
      <g stroke="#523924" stroke-width="0.8" opacity="0.6">
        <line x1="30" y1="120" x2="150" y2="120" />
        <line x1="30" y1="140" x2="150" y2="140" />
        <line x1="30" y1="160" x2="120" y2="160" />
      </g>
    </g>

    <!-- Vintage Glass Cake Stand & Tiered Cake (Left / Center) -->
    <g transform="translate(60, 90)">
      <!-- Pedestal Cast Shadow on Table -->
      <ellipse cx="100" cy="220" rx="110" ry="24" fill="#080402" opacity="0.65" />

      <!-- Ornate Fluted Glass Stand Foot -->
      <polygon points="80,185 120,185 140,215 60,215" fill="#4d6273" opacity="0.35" stroke="#90afc9" stroke-width="1" />
      <ellipse cx="100" cy="215" rx="40" ry="8" fill="#90afc9" opacity="0.4" />
      <!-- Glass Plate -->
      <ellipse cx="100" cy="185" rx="105" ry="18" fill="#90afc9" opacity="0.45" stroke="#d5e5f2" stroke-width="1.2" />

      <!-- Cake Tier 1 (Bottom Tier) -->
      <path d="M20,135 C20,155 180,155 180,135 L180,175 C180,195 20,195 20,175 Z" fill="url(#frosting_mc015)" stroke="#9c876c" stroke-width="1" />
      <ellipse cx="100" cy="135" rx="80" ry="16" fill="#fbf4e8" stroke="#9c876c" stroke-width="1" />
      <!-- Bottom Tier Frosting Swirls & Berries -->
      <g fill="#8c1b26" stroke="#4d0e15" stroke-width="0.8">
        <circle cx="35" cy="140" r="5" />
        <circle cx="65" cy="148" r="5" />
        <circle cx="100" cy="151" r="5.5" />
        <circle cx="135" cy="148" r="5" />
        <circle cx="165" cy="140" r="5" />
      </g>

      <!-- Cake Tier 2 (Top Tier) -->
      <path d="M45,95 C45,110 155,110 155,95 L155,130 C155,145 45,145 45,130 Z" fill="url(#frosting_mc015)" stroke="#9c876c" stroke-width="1" />
      <ellipse cx="100" cy="95" rx="55" ry="12" fill="#fff9ef" stroke="#9c876c" stroke-width="1" />
      <!-- Top Tier Fresh Wild Blackberries & Mint Leaves -->
      <g fill="#360f15">
        <circle cx="85" cy="95" r="4.5" />
        <circle cx="95" cy="98" r="4" />
        <circle cx="108" cy="96" r="4.5" />
        <circle cx="118" cy="93" r="4" />
      </g>
      <path d="M78,92 Q70,82 82,85 Z" fill="#2d3d20" />
      <path d="M125,90 Q135,82 122,85 Z" fill="#2d3d20" />

      <!-- Single Glowing Golden Birthday Candle -->
      <g transform="translate(100, 30)">
        <!-- Slender Candle Body -->
        <rect x="-3" y="15" width="6" height="50" fill="#ffd56b" stroke="#a88523" stroke-width="0.8" rx="1" />
        <line x1="-3" y1="28" x2="3" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        <line x1="-3" y1="42" x2="3" y2="39" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        <!-- Candle Wick -->
        <line x1="0" y1="15" x2="0" y2="7" stroke="#1c0f0a" stroke-width="1.5" />
        <!-- Golden Candle Flame -->
        <ellipse cx="0" cy="0" rx="5" ry="10" fill="#ff9f1c" />
        <ellipse cx="0" cy="2" rx="2.5" ry="6" fill="#ffffff" />
        <!-- Flame Sparkle -->
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.8" />
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.8" />
      </g>
    </g>

    <!-- Sprig of Wildflowers & Satin Ribbon in Foreground -->
    <g transform="translate(240, 240) rotate(-12)">
      <!-- Satin Ribbon Bow -->
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#8c1b26" transform="rotate(-25, 0, 0)" />
      <ellipse cx="15" cy="0" rx="18" ry="8" fill="#8c1b26" transform="rotate(25, 15, 0)" />
      <circle cx="7" cy="0" r="5" fill="#d4af37" />
      <!-- Flower Stems -->
      <path d="M7,0 Q40,-20 80,-15" fill="none" stroke="#2d3d20" stroke-width="2" stroke-linecap="round" />
      <circle cx="75" cy="-15" r="7" fill="#f5ede1" stroke="#bda682" stroke-width="0.8" />
      <circle cx="75" cy="-15" r="3" fill="#ffd56b" />
    </g>
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc015)" />

  <!-- Vintage Ornate Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Birthday Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#24140c" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">BIRTHDAY</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Candle icon inside stamp -->
    <line x1="42" y1="48" x2="42" y2="58" stroke="#d4af37" stroke-width="2" />
    <circle cx="42" cy="44" r="2.5" fill="#ffd166" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">SPECIAL</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">CELEBRATION</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#120804" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#120804" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
