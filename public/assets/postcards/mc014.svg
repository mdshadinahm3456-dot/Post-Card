<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Warm Sepia Parchment Gradient -->
    <linearGradient id="parchGrad_mc014" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1e18" />
      <stop offset="40%" stop-color="#231712" />
      <stop offset="80%" stop-color="#1a100c" />
      <stop offset="100%" stop-color="#120a07" />
    </linearGradient>

    <!-- Warm Sepia Photograph Tint -->
    <linearGradient id="photoGrad_mc014" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ede0ca" />
      <stop offset="50%" stop-color="#d6be9a" />
      <stop offset="100%" stop-color="#b89a6f" />
    </linearGradient>

    <!-- Golden Ribbon Gradient -->
    <linearGradient id="goldRibbon_mc014" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997b26" />
    </linearGradient>

    <pattern id="grain_mc014" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Parchment Canvas -->
  <rect width="900" height="600" fill="url(#parchGrad_mc014)" />

  <!-- Soft Ambient Glow Behind Frames -->
  <circle cx="450" cy="220" r="280" fill="#ffd56b" opacity="0.15" />

  <!-- Composition: Two Vintage Sepia Picture Frames Tied with Golden Ribbon -->
  <g transform="translate(180, 80)">
    <!-- Frame 1 (Left - Tilted Slightly Left) -->
    <g transform="translate(40, 20) rotate(-6)">
      <!-- Frame Cast Shadow -->
      <rect x="8" y="8" width="180" height="230" rx="4" fill="#090503" opacity="0.5" />
      <!-- Cream Cardstock Border -->
      <rect x="0" y="0" width="180" height="230" rx="4" fill="#f0e4d0" stroke="#b09875" stroke-width="1.5" />
      <!-- Inner Sepia Photo Area -->
      <rect x="15" y="15" width="150" height="175" fill="url(#photoGrad_mc014)" stroke="#785a36" stroke-width="1" />
      <!-- Sepia Photo Silhouette: Bride / Woman in Saree -->
      <g transform="translate(45, 30)" opacity="0.75">
        <circle cx="45" cy="35" r="14" fill="#4d3520" />
        <path d="M30,50 C30,42 60,42 60,50 L65,115 L25,115 Z" fill="#4d3520" />
        <path d="M28,55 Q50,75 58,100" fill="none" stroke="#6e4f32" stroke-width="2" />
      </g>
      <!-- Date Handwritten on Photo Margin -->
      <text x="90" y="212" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="14" fill="#523924">Our First Day, 1954</text>
      <!-- Little Vintage Corner Pin / Clip -->
      <circle cx="90" cy="5" r="3.5" fill="#d4af37" stroke="#69511a" stroke-width="0.8" />
    </g>

    <!-- Frame 2 (Right - Tilted Slightly Right) -->
    <g transform="translate(260, 30) rotate(5)">
      <!-- Frame Cast Shadow -->
      <rect x="8" y="8" width="180" height="230" rx="4" fill="#090503" opacity="0.5" />
      <!-- Cream Cardstock Border -->
      <rect x="0" y="0" width="180" height="230" rx="4" fill="#f0e4d0" stroke="#b09875" stroke-width="1.5" />
      <!-- Inner Sepia Photo Area -->
      <rect x="15" y="15" width="150" height="175" fill="url(#photoGrad_mc014)" stroke="#785a36" stroke-width="1" />
      <!-- Sepia Photo Silhouette: Groom / Man in Vintage Suit -->
      <g transform="translate(45, 30)" opacity="0.75">
        <circle cx="45" cy="34" r="14" fill="#4d3520" />
        <path d="M28,48 C28,40 62,40 62,48 L66,115 L24,115 Z" fill="#4d3520" />
        <polygon points="45,55 52,68 45,78 38,68" fill="#872b2b" />
      </g>
      <!-- Date Handwritten on Photo Margin -->
      <text x="90" y="212" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="14" fill="#523924">Together Forever</text>
      <!-- Little Vintage Corner Pin / Clip -->
      <circle cx="90" cy="5" r="3.5" fill="#d4af37" stroke="#69511a" stroke-width="0.8" />
    </g>

    <!-- Watercolor Floral Garland Framing the Photos -->
    <!-- Eucalyptus Leaves & Vintage Rose Sprigs -->
    <g fill="#2d3d22" stroke="#1c2615" stroke-width="0.8" opacity="0.85">
      <!-- Left Sprigs -->
      <path d="M15,140 Q-15,110 5,80 Q25,110 15,140 Z" />
      <path d="M5,100 Q-25,90 -10,70 Q10,80 5,100 Z" />
      <path d="M25,60 Q5,30 20,10 Q35,40 25,60 Z" />
      <!-- Right Sprigs -->
      <path d="M470,150 Q500,120 480,90 Q460,120 470,150 Z" />
      <path d="M480,110 Q510,100 495,80 Q475,90 480,110 Z" />
      <path d="M460,70 Q480,40 465,20 Q450,50 460,70 Z" />
    </g>

    <!-- Delicate Vintage Rose Blooms along the Garland -->
    <g transform="translate(15, 120)">
      <circle cx="0" cy="0" r="12" fill="#8c1b26" />
      <circle cx="0" cy="0" r="8" fill="#ab2432" />
      <circle cx="0" cy="0" r="4" fill="#ffd56b" />
    </g>
    <g transform="translate(470, 130)">
      <circle cx="0" cy="0" r="12" fill="#8c1b26" />
      <circle cx="0" cy="0" r="8" fill="#ab2432" />
      <circle cx="0" cy="0" r="4" fill="#ffd56b" />
    </g>

    <!-- Golden Ribbon Bow Connecting the Two Frames -->
    <g transform="translate(245, 120)">
      <!-- Ribbon Tails -->
      <path d="M0,0 Q-30,40 -20,80" fill="none" stroke="url(#goldRibbon_mc014)" stroke-width="6" stroke-linecap="round" />
      <path d="M0,0 Q30,40 20,80" fill="none" stroke="url(#goldRibbon_mc014)" stroke-width="6" stroke-linecap="round" />
      <!-- Ribbon Bow Loops -->
      <ellipse cx="-20" cy="-5" rx="22" ry="12" fill="url(#goldRibbon_mc014)" stroke="#8c6c19" stroke-width="1" transform="rotate(-20, -20, -5)" />
      <ellipse cx="20" cy="-5" rx="22" ry="12" fill="url(#goldRibbon_mc014)" stroke="#8c6c19" stroke-width="1" transform="rotate(20, 20, -5)" />
      <!-- Center Knot -->
      <circle cx="0" cy="0" r="8" fill="#ffd56b" stroke="#8c6c19" stroke-width="1.2" />
    </g>
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc014)" />

  <!-- Double Frame Vintage Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55" rx="6" />
  <rect x="33" y="33" width="834" height="534" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Anniversary Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#20140e" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">ANNIVERSARY</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <path d="M36,52 L48,52 M42,46 L42,58" stroke="#d4af37" stroke-width="1.5" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">FOREVER</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">YEARS OF LOVE</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#120a06" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#120a06" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
