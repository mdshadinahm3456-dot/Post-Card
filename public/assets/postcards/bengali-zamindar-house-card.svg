<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Warm Heritage Sky Gradient -->
    <linearGradient id="skyGrad_mc008" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1a14" />
      <stop offset="50%" stop-color="#3d2218" />
      <stop offset="85%" stop-color="#59301e" />
      <stop offset="100%" stop-color="#24130c" />
    </linearGradient>

    <!-- Warm Golden Sunlight Shaft -->
    <linearGradient id="sunBeam_mc008" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3d2218" stop-opacity="0" />
    </linearGradient>

    <!-- Rickshaw Hood Gradient (Classic Red & Yellow Floral Tin Tones) -->
    <linearGradient id="hoodGrad_mc008" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a82532" />
      <stop offset="50%" stop-color="#7a1822" />
      <stop offset="100%" stop-color="#4d0e15" />
    </linearGradient>

    <pattern id="grain_mc008" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="900" height="600" fill="url(#skyGrad_mc008)" />

  <!-- Old Dhaka Heritage Buildings (Narrow Lane Perspective) -->
  <!-- Left Side Historic Brick Colonial Building -->
  <g fill="#21130d" stroke="#361f15" stroke-width="1.5">
    <polygon points="0,0 260,110 260,600 0,600" />
    <!-- Overhanging Wooden Balconies & Jali Screens -->
    <rect x="60" y="140" width="160" height="70" fill="#2d1a12" />
    <!-- Balcony Railing Bars -->
    <g stroke="#d4af37" stroke-width="1.2" opacity="0.4">
      <line x1="60" y1="180" x2="220" y2="180" />
      <line x1="60" y1="210" x2="220" y2="210" />
      <line x1="80" y1="180" x2="80" y2="210" />
      <line x1="110" y1="180" x2="110" y2="210" />
      <line x1="140" y1="180" x2="140" y2="210" />
      <line x1="170" y1="180" x2="170" y2="210" />
      <line x1="200" y1="180" x2="200" y2="210" />
    </g>
    <!-- Arched Windows with Wooden Louvers -->
    <path d="M100,80 C100,55 140,55 140,80 L140,120 L100,120 Z" fill="#140a06" />
    <path d="M160,95 C160,75 190,75 190,95 L190,130 L160,130 Z" fill="#140a06" />
    <!-- Lower Shop Shutter / Wooden Doorway -->
    <rect x="70" y="270" width="140" height="150" fill="#170c08" />
    <line x1="140" y1="270" x2="140" y2="420" stroke="#3d2216" stroke-width="2" />
  </g>

  <!-- Right Side Historic Heritage Building -->
  <g fill="#24150e" stroke="#3b2217" stroke-width="1.5">
    <polygon points="900,0 660,120 660,600 900,600" />
    <!-- Carved Cornice and Wooden Veranda -->
    <rect x="700" y="150" width="150" height="65" fill="#301c13" />
    <g stroke="#d4af37" stroke-width="1.2" opacity="0.4">
      <line x1="700" y1="185" x2="850" y2="185" />
      <line x1="700" y1="215" x2="850" y2="215" />
      <line x1="720" y1="185" x2="720" y2="215" />
      <line x1="750" y1="185" x2="750" y2="215" />
      <line x1="780" y1="185" x2="780" y2="215" />
      <line x1="810" y1="185" x2="810" y2="215" />
    </g>
    <path d="M720,85 C720,65 760,65 760,85 L760,130 L720,130 Z" fill="#140b07" />
  </g>

  <!-- Dramatic Sunlight Shaft Cascading Down the Alley -->
  <polygon points="350,0 520,0 620,450 300,450" fill="url(#sunBeam_mc008)" />

  <!-- Overhead Tangle of Vintage Cables / Wires -->
  <g stroke="#120905" stroke-width="1.2" fill="none" opacity="0.65">
    <path d="M220,110 Q450,160 690,130" />
    <path d="M190,130 Q460,195 720,145" />
    <path d="M250,90 Q440,140 670,115" />
  </g>

  <!-- Old Iron Street Lantern Hanging between Buildings -->
  <g transform="translate(460, 160)">
    <line x1="0" y1="-20" x2="0" y2="15" stroke="#160c07" stroke-width="2" />
    <polygon points="-12,15 12,15 9,35 -9,35" fill="#ffd166" opacity="0.7" stroke="#1c0f09" stroke-width="1.2" />
    <circle cx="0" cy="25" r="18" fill="#ffd166" opacity="0.25" />
  </g>

  <!-- Paved Cobblestone Lane Ground -->
  <polygon points="260,320 660,320 780,600 140,600" fill="#160d08" stroke="#361f15" stroke-width="1.5" />

  <!-- Cobblestone Lines Perspective -->
  <g stroke="#29170f" stroke-width="1" opacity="0.7">
    <line x1="380" y1="320" x2="300" y2="600" />
    <line x1="460" y1="320" x2="460" y2="600" />
    <line x1="540" y1="320" x2="620" y2="600" />
    <line x1="250" y1="400" x2="670" y2="400" />
    <line x1="220" y1="470" x2="700" y2="470" />
    <line x1="180" y1="540" x2="740" y2="540" />
  </g>

  <!-- Hero Illustration: Vintage Dhaka Cycle Rickshaw (Center-Right Angle) -->
  <g transform="translate(360, 240)">
    <!-- Rickshaw Cast Shadow on Cobblestones -->
    <ellipse cx="60" cy="205" rx="140" ry="26" fill="#080403" opacity="0.65" />

    <!-- Big Spoked Rear Wheels (Left & Right) -->
    <!-- Far Rear Wheel -->
    <circle cx="25" cy="180" r="42" fill="none" stroke="#24140c" stroke-width="4" />
    <circle cx="25" cy="180" r="3" fill="#ffd166" />
    <!-- Near Rear Wheel (Decorated Rim) -->
    <circle cx="95" cy="190" r="48" fill="none" stroke="#1a0e08" stroke-width="5" />
    <circle cx="95" cy="190" r="46" fill="none" stroke="#d4af37" stroke-width="1.2" />
    <!-- Spokes -->
    <g stroke="#78532f" stroke-width="1" opacity="0.75">
      <line x1="95" y1="142" x2="95" y2="238" />
      <line x1="47" y1="190" x2="143" y2="190" />
      <line x1="61" y1="156" x2="129" y2="224" />
      <line x1="61" y1="224" x2="129" y2="156" />
    </g>
    <circle cx="95" cy="190" r="5" fill="#d4af37" />

    <!-- Decorated Tin Art Plate on Back of Rickshaw (Traditional Rickshaw Paint Art) -->
    <rect x="35" y="145" width="55" height="30" rx="3" fill="#2d5236" stroke="#d4af37" stroke-width="1.2" />
    <!-- Taj Mahal / River Motif inside Tin Plate -->
    <ellipse cx="62" cy="160" rx="14" ry="7" fill="#e8c566" />
    <circle cx="62" cy="155" r="4" fill="#a82532" />

    <!-- Passenger Seat & Cushioned Armrests -->
    <rect x="18" y="110" width="85" height="36" rx="4" fill="#2a160d" stroke="#522f1d" stroke-width="1.5" />
    <!-- Ornate Rickshaw Hood (Folded Back / Semi-Open) -->
    <path d="M12,120 C8,45 88,40 102,110 C90,115 20,122 12,120 Z" fill="url(#hoodGrad_mc008)" stroke="#d4af37" stroke-width="1.8" />
    <!-- Hood Accordion Ribs & Frills -->
    <path d="M15,115 C20,60 85,55 98,105" fill="none" stroke="#f5c252" stroke-width="1.5" stroke-dasharray="4 2" />
    <path d="M22,112 C28,75 75,70 88,105" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <!-- Brass Finial / Rosette on Hood Side -->
    <circle cx="95" cy="105" r="5" fill="#ffd166" stroke="#6e4d16" stroke-width="1" />

    <!-- Front Bicycle Frame & Handlebars -->
    <line x1="60" y1="155" x2="-25" y2="160" stroke="#1c0f09" stroke-width="4" />
    <line x1="-25" y1="160" x2="-20" y2="125" stroke="#1c0f09" stroke-width="3" />
    <line x1="-32" y1="125" x2="-10" y2="125" stroke="#d4af37" stroke-width="2.5" />
    <!-- Front Wheel -->
    <circle cx="-55" cy="185" r="36" fill="none" stroke="#1a0e08" stroke-width="4" />
    <circle cx="-55" cy="185" r="34" fill="none" stroke="#d4af37" stroke-width="0.8" />

    <!-- Romantic Motif: Two Silhouettes Walking Hand in Hand on the Lane Behind -->
    <g transform="translate(-140, 50)">
      <circle cx="32" cy="30" r="7" fill="#140a06" />
      <path d="M24,37 C24,32 40,32 40,37 L42,90 L34,90 L33,65 L28,90 L22,90 Z" fill="#140a06" />
      <circle cx="48" cy="33" r="6.5" fill="#140a06" />
      <path d="M42,40 C42,35 54,35 54,40 L57,89 L50,89 L47,67 L44,89 L38,89 Z" fill="#140a06" />
      <!-- Draped Saree Pallu -->
      <path d="M44,44 Q56,58 60,72 Q54,75 44,55 Z" fill="#1f100a" />
      <!-- Hand Clasp -->
      <line x1="36" y1="52" x2="43" y2="52" stroke="#140a06" stroke-width="2" />
    </g>
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc008)" />

  <!-- Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Dhaka Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#24140c" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">OLD DHAKA</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Rickshaw wheel inside stamp -->
    <circle cx="42" cy="52" r="8" fill="none" stroke="#d4af37" stroke-width="1" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1952</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">HERITAGE RIDE</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#120804" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#120804" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
