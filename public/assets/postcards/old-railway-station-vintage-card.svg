<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Twilight Sky Gradient -->
    <linearGradient id="twilight_mc006" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="40%" stop-color="#241d22" />
      <stop offset="70%" stop-color="#3d2a23" />
      <stop offset="100%" stop-color="#1b1411" />
    </linearGradient>

    <!-- Locomotive Headlight Glow -->
    <radialGradient id="trainLight_mc006" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="1" />
      <stop offset="30%" stop-color="#f5c252" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#c98a28" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1b1411" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Concrete Gradient -->
    <linearGradient id="platformGrad_mc006" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241e1a" />
      <stop offset="100%" stop-color="#120e0c" />
    </linearGradient>

    <pattern id="grain_mc006" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="24" cy="12" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Twilight Sky -->
  <rect width="900" height="600" fill="url(#twilight_mc006)" />

  <!-- Railway Station Arched Canopy / Iron Trusses Overhead -->
  <g stroke="#1b1410" stroke-width="3" fill="none">
    <!-- Main Arches -->
    <path d="M0,120 Q450,-20 900,120" stroke-width="6" />
    <path d="M0,140 Q450,20 900,140" stroke-width="4" />
    <!-- Diagonal Lattice Trusses -->
    <line x1="80" y1="90" x2="140" y2="135" />
    <line x1="140" y1="135" x2="200" y2="70" />
    <line x1="200" y1="70" x2="260" y2="130" />
    <line x1="260" y1="130" x2="320" y2="50" />
    <line x1="320" y1="50" x2="380" y2="125" />
    <line x1="380" y1="125" x2="440" y2="35" />
    <line x1="440" y1="35" x2="500" y2="125" />
    <line x1="500" y1="125" x2="560" y2="45" />
    <line x1="560" y1="45" x2="620" y2="130" />
    <line x1="620" y1="130" x2="680" y2="65" />
    <line x1="680" y1="65" x2="740" y2="135" />
    <!-- Station Columns -->
    <line x1="60" y1="100" x2="60" y2="450" stroke-width="7" />
    <line x1="840" y1="100" x2="840" y2="450" stroke-width="7" />
  </g>

  <!-- Hanging Double-Sided Station Clock (Top Center-Left) -->
  <g transform="translate(340, 75)">
    <!-- Bracket -->
    <line x1="20" y1="0" x2="20" y2="35" stroke="#16100c" stroke-width="3" />
    <!-- Ornate Scroll -->
    <path d="M20,15 C35,15 45,25 35,35" fill="none" stroke="#16100c" stroke-width="2" />
    <!-- Clock Face Shadow & Body -->
    <circle cx="20" cy="55" r="26" fill="#0c0806" />
    <circle cx="20" cy="55" r="24" fill="#f5ede1" stroke="#2b1e16" stroke-width="2" />
    <circle cx="20" cy="55" r="22" fill="none" stroke="#d4af37" stroke-width="0.8" />
    <!-- Clock Hands (6:45 PM) -->
    <line x1="20" y1="55" x2="10" y2="55" stroke="#1b120c" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="55" x2="20" y2="42" stroke="#1b120c" stroke-width="2" stroke-linecap="round" />
    <circle cx="20" cy="55" r="2" fill="#1b120c" />
  </g>

  <!-- Vintage Steam Locomotive / Train (Left Side Track) -->
  <g transform="translate(40, 180)">
    <!-- Steam / Smoke Cloud Drifting -->
    <path d="M90,70 Q140,20 200,50 T300,30 T400,60" fill="none" stroke="#ffffff" stroke-width="22" opacity="0.12" stroke-linecap="round" />
    <path d="M110,60 Q170,15 240,40 T360,25" fill="none" stroke="#ffffff" stroke-width="15" opacity="0.15" stroke-linecap="round" />

    <!-- Train Silhouette Body -->
    <!-- Chimney / Smokestack -->
    <rect x="80" y="55" width="22" height="35" fill="#15100c" />
    <polygon points="76,55 106,55 102,45 80,45" fill="#15100c" />
    <!-- Boiler / Body -->
    <path d="M60,90 L240,90 L240,190 L60,190 Z" fill="#1c1511" stroke="#33241b" stroke-width="2" />
    <!-- Rounded Boiler Front -->
    <ellipse cx="60" cy="140" rx="20" ry="50" fill="#15100c" stroke="#33241b" stroke-width="2" />
    <!-- Driver's Cabin -->
    <rect x="235" y="60" width="75" height="130" fill="#18110d" stroke="#33241b" stroke-width="2" />
    <!-- Cabin Window with Warm Glow -->
    <rect x="250" y="75" width="25" height="35" fill="#ffd166" opacity="0.75" rx="2" />
    <rect x="285" y="75" width="15" height="35" fill="#ffd166" opacity="0.75" rx="2" />
    <!-- Tender / Coal Car -->
    <rect x="310" y="100" width="80" height="90" fill="#15100c" />

    <!-- Locomotive Big Headlight & Beam -->
    <circle cx="45" cy="140" r="16" fill="#f5c252" stroke="#16100c" stroke-width="2" />
    <circle cx="45" cy="140" r="12" fill="#ffffff" />
    <!-- Forward Light Beam Cone -->
    <polygon points="45,140 0,70 0,210" fill="url(#trainLight_mc006)" opacity="0.85" />

    <!-- Train Wheels (Silhouette) -->
    <g fill="#100b08" stroke="#3d2c20" stroke-width="1.5">
      <circle cx="95" cy="195" r="22" />
      <circle cx="150" cy="195" r="22" />
      <circle cx="205" cy="195" r="22" />
      <line x1="95" y1="195" x2="205" y2="195" stroke="#78593e" stroke-width="3" />
    </g>
  </g>

  <!-- Steel Railway Tracks (Ground Level) -->
  <g transform="translate(0, 360)">
    <!-- Ballast Bed -->
    <polygon points="0,20 380,20 340,110 0,110" fill="#110d0a" />
    <!-- Wooden Sleepers / Ties -->
    <g stroke="#261b14" stroke-width="5" opacity="0.85">
      <line x1="20" y1="40" x2="160" y2="40" />
      <line x1="20" y1="60" x2="180" y2="60" />
      <line x1="20" y1="80" x2="200" y2="80" />
      <line x1="20" y1="100" x2="220" y2="100" />
    </g>
    <!-- Steel Rails (Gleaming in Light) -->
    <line x1="0" y1="45" x2="360" y2="45" stroke="#877158" stroke-width="3" />
    <line x1="0" y1="85" x2="320" y2="85" stroke="#877158" stroke-width="3.5" />
    <line x1="0" y1="45" x2="360" y2="45" stroke="#f5d8a0" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Station Platform Surface (Right Half) -->
  <polygon points="340,380 900,380 900,600 300,600" fill="url(#platformGrad_mc006)" />
  <!-- Platform Coping Edge Line -->
  <line x1="340" y1="380" x2="300" y2="600" stroke="#d4af37" stroke-width="2.5" opacity="0.6" />
  <line x1="346" y1="380" x2="306" y2="600" stroke="#4a3729" stroke-width="1.5" stroke-dasharray="10 6" />

  <!-- Platform Vintage Lamp Post -->
  <g transform="translate(720, 240)">
    <line x1="20" y1="0" x2="20" y2="160" stroke="#1d1611" stroke-width="4" />
    <polygon points="10,20 30,20 26,0 14,0" fill="#ffd166" opacity="0.85" />
    <circle cx="20" cy="10" r="28" fill="#ffd166" opacity="0.2" />
  </g>

  <!-- Two Distant Silhouettes Saying Goodbye on Platform -->
  <g transform="translate(520, 315)">
    <!-- Wet Platform Cast Shadows -->
    <ellipse cx="45" cy="85" rx="35" ry="8" fill="#080605" opacity="0.6" />

    <!-- Vintage Suitcase Resting on Ground -->
    <rect x="5" y="65" width="22" height="18" rx="2" fill="#3a2519" stroke="#1b110b" stroke-width="1" />
    <line x1="12" y1="65" x2="12" y2="83" stroke="#d4af37" stroke-width="0.8" />
    <line x1="20" y1="65" x2="20" y2="83" stroke="#d4af37" stroke-width="0.8" />
    <path d="M12,65 Q16,60 20,65" fill="none" stroke="#1b110b" stroke-width="1.5" />

    <!-- Person 1 (Man - Trench Coat / Suit) -->
    <circle cx="42" cy="22" r="7" fill="#140f0c" />
    <path d="M34,29 C34,24 50,24 50,29 L52,78 L46,78 L44,52 L40,78 L34,78 Z" fill="#140f0c" />

    <!-- Person 2 (Woman - Draped Saree / Shawl, Holding Hands) -->
    <circle cx="58" cy="24" r="6.5" fill="#140f0c" />
    <path d="M52,31 C52,26 64,26 64,31 L67,77 L60,77 L57,54 L53,77 L48,77 Z" fill="#140f0c" />
    <!-- Shawl Flowing Silhouette -->
    <path d="M54,34 Q66,45 70,60 Q65,65 55,42 Z" fill="#1b130e" />

    <!-- Tender Hand Clasp Gesture -->
    <line x1="46" y1="42" x2="52" y2="42" stroke="#140f0c" stroke-width="2.5" />
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc006)" />

  <!-- Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Railway Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#1d1612" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">RAILWAY</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Clock icon inside stamp -->
    <circle cx="42" cy="52" r="10" fill="none" stroke="#d4af37" stroke-width="1" />
    <line x1="42" y1="52" x2="38" y2="52" stroke="#d4af37" stroke-width="1.2" />
    <line x1="42" y1="52" x2="42" y2="46" stroke="#d4af37" stroke-width="1.2" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1947</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">PLATFORM 1</text>
    <!-- Postmark cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#120c09" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#120c09" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
