<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Foggy Bengal Winter Sky Gradient -->
    <linearGradient id="fogSky_mc016" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222b36" />
      <stop offset="40%" stop-color="#3c4a57" />
      <stop offset="70%" stop-color="#72828f" />
      <stop offset="85%" stop-color="#b5bec7" />
      <stop offset="100%" stop-color="#d6dde3" />
    </linearGradient>

    <!-- Pale Winter Sun Halo in Thick Fog -->
    <radialGradient id="paleSun_mc016" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e3" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fcedc0" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#72828f" stop-opacity="0" />
    </radialGradient>

    <!-- Wooden Window Sill Gradient -->
    <linearGradient id="sillGrad_mc016" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b271d" />
      <stop offset="30%" stop-color="#2b1a12" />
      <stop offset="100%" stop-color="#160c07" />
    </linearGradient>

    <pattern id="grain_mc016" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.05" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Foggy Winter Sky -->
  <rect width="900" height="380" fill="url(#fogSky_mc016)" />

  <!-- Pale Morning Winter Sun Shrouded in Fog -->
  <circle cx="580" cy="180" r="140" fill="url(#paleSun_mc016)" />
  <circle cx="580" cy="180" r="42" fill="#fffdf5" opacity="0.8" />

  <!-- Silhouetted Distant Mustard Fields & Palm Trees in Thick Morning Mist -->
  <g fill="#43505c" opacity="0.45">
    <path d="M0,320 Q240,290 480,310 T900,300 L900,380 L0,380 Z" />
    <!-- Distant Palm Silhouettes in Fog -->
    <path d="M120,310 Q123,260 126,220" stroke="#37434f" stroke-width="2.5" fill="none" />
    <path d="M126,220 Q105,205 95,225" stroke="#37434f" stroke-width="1.8" fill="none" />
    <path d="M126,220 Q135,200 150,215" stroke="#37434f" stroke-width="1.8" fill="none" />
    <path d="M126,220 Q145,210 150,235" stroke="#37434f" stroke-width="1.8" fill="none" />
    <!-- Distant Trees -->
    <ellipse cx="280" cy="305" rx="55" ry="22" />
    <ellipse cx="760" cy="295" rx="75" ry="26" />
  </g>

  <!-- Thick Winter Fog Bank Layer Across Horizon -->
  <rect x="0" y="290" width="900" height="90" fill="#cbd5de" opacity="0.45" />

  <!-- Wooden Window Sill & Window Frame (Foreground) -->
  <polygon points="0,350 900,350 900,600 0,600" fill="url(#sillGrad_mc016)" />
  <!-- Heavy Wooden Sill Top Edge -->
  <line x1="0" y1="350" x2="900" y2="350" stroke="#523829" stroke-width="3" />
  <line x1="0" y1="365" x2="900" y2="365" stroke="#1c110a" stroke-width="2" />

  <!-- Window Frame Vertical Mullions (Left & Right) -->
  <rect x="50" y="0" width="30" height="350" fill="#2b1a12" stroke="#160c07" stroke-width="1.5" />
  <rect x="820" y="0" width="30" height="350" fill="#2b1a12" stroke="#160c07" stroke-width="1.5" />

  <!-- Morning Condensation & Dew Drops on Glass Panes -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="140" cy="180" r="2.5" />
    <circle cx="142" cy="195" r="1.8" />
    <circle cx="220" cy="240" r="3" />
    <circle cx="222" cy="260" r="2" />
    <circle cx="340" cy="160" r="2.5" />
    <circle cx="480" cy="220" r="3" />
    <circle cx="700" cy="190" r="2.5" />
    <!-- Run-down Water Trickle Lines -->
    <line x1="220" y1="240" x2="221" y2="280" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
    <line x1="480" y1="220" x2="481" y2="270" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Cozy Still Life: Earthen Tea Cup (মাটির ভাঁড়) & Steaming Hot Tea -->
  <g transform="translate(340, 275)">
    <!-- Cup Cast Shadow on Sill -->
    <ellipse cx="60" cy="95" rx="42" ry="14" fill="#0c0704" opacity="0.65" />

    <!-- Traditional Clay Cup (ভাঁড়) Body -->
    <polygon points="25,25 95,25 82,90 38,90" fill="#a8593b" stroke="#63311f" stroke-width="1.5" />
    <!-- Lip of the Earthen Cup -->
    <ellipse cx="60" cy="25" rx="35" ry="10" fill="#bd6846" stroke="#63311f" stroke-width="1.2" />
    <!-- Hot Cardamom Tea Surface Inside -->
    <ellipse cx="60" cy="26" rx="31" ry="8" fill="#522b17" />
    <ellipse cx="60" cy="26" rx="20" ry="5" fill="#874726" />

    <!-- Authentic Curling Steam Wisps Rising in Cold Winter Air -->
    <g stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.65" stroke-linecap="round">
      <path d="M48,15 Q36,-10 52,-35 T40,-65 T50,-95" />
      <path d="M60,12 Q72,-15 58,-45 T70,-75 T60,-105" />
      <path d="M72,15 Q82,-8 70,-32 T80,-60 T70,-90" />
    </g>
  </g>

  <!-- Warm Woolen Shawl Draped Over the Windowsill (Foreground Left) -->
  <g transform="translate(110, 310)">
    <!-- Shawl Cast Shadow -->
    <ellipse cx="90" cy="130" rx="110" ry="30" fill="#0c0704" opacity="0.65" />
    <!-- Folds of the Woolen Shawl (Rich Forest Green / Mustard Trim) -->
    <path d="M10,40 Q90,15 170,35 Q180,95 160,135 Q70,145 0,115 Z" fill="#2d3d2e" stroke="#1c261d" stroke-width="2" />
    <path d="M30,45 Q100,30 160,50" fill="none" stroke="#d4af37" stroke-width="2" />
    <path d="M20,65 Q95,50 155,70" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6" stroke-dasharray="6 3" />
    <!-- Shawl Fringe Tassels Hanging Over Edge of Sill -->
    <g stroke="#d4af37" stroke-width="1.5" stroke-linecap="round">
      <line x1="20" y1="120" x2="18" y2="145" />
      <line x1="35" y1="125" x2="33" y2="150" />
      <line x1="50" y1="130" x2="48" y2="155" />
      <line x1="65" y1="133" x2="63" y2="158" />
      <line x1="80" y1="135" x2="79" y2="160" />
      <line x1="95" y1="137" x2="95" y2="162" />
      <line x1="110" y1="137" x2="111" y2="162" />
      <line x1="125" y1="135" x2="127" y2="160" />
      <line x1="140" y1="132" x2="143" y2="157" />
    </g>
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc016)" />

  <!-- Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Winter Monsoon Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#20272e" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">WINTER</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Tea cup icon inside stamp -->
    <path d="M34,48 L50,48 L46,58 L38,58 Z" fill="#d4af37" opacity="0.8" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1954</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#a6b8c7">BENGAL COLD</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#12171c" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#12171c" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
