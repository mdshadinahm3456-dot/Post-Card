<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky_mc003" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="45%" stop-color="#101827" />
      <stop offset="75%" stop-color="#151e2b" />
      <stop offset="100%" stop-color="#0b1118" />
    </linearGradient>

    <!-- Moon Radial Glow -->
    <radialGradient id="moonGlow_mc003" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="1" />
      <stop offset="40%" stop-color="#ffe8a3" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#101827" stop-opacity="0" />
    </radialGradient>

    <!-- Water Surface Gradient -->
    <linearGradient id="riverGrad_mc003" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121b24" />
      <stop offset="40%" stop-color="#0d141c" />
      <stop offset="80%" stop-color="#090e14" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <!-- Water Moon Reflection Gradient -->
    <linearGradient id="waterReflect_mc003" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#101827" stop-opacity="0" />
    </linearGradient>

    <pattern id="grain_mc003" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#6d8da8" opacity="0.08" />
      <circle cx="16" cy="22" r="0.9" fill="#ffffff" opacity="0.04" />
      <circle cx="24" cy="12" r="0.6" fill="#000000" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="900" height="600" fill="url(#nightSky_mc003)" />

  <!-- Stars in Night Sky -->
  <g fill="#ffffff">
    <circle cx="95" cy="75" r="1" opacity="0.6" />
    <circle cx="145" cy="115" r="1.4" opacity="0.8" />
    <circle cx="185" cy="65" r="0.8" opacity="0.5" />
    <circle cx="230" cy="140" r="1.2" opacity="0.7" />
    <circle cx="290" cy="85" r="1" opacity="0.6" />
    <circle cx="340" cy="120" r="1.5" opacity="0.75" />
    <circle cx="480" cy="95" r="1.1" opacity="0.65" />
    <circle cx="530" cy="60" r="1.3" opacity="0.8" />
    <circle cx="620" cy="110" r="0.9" opacity="0.55" />
    <circle cx="680" cy="70" r="1.4" opacity="0.85" />
    <circle cx="780" cy="130" r="1" opacity="0.6" />
    <circle cx="830" cy="80" r="1.6" opacity="0.8" />
    <!-- Twinkle Cross -->
    <path d="M145,110 L145,120 M140,115 L150,115" stroke="#ffffff" stroke-width="0.7" opacity="0.7" />
    <path d="M530,55 L530,65 M525,60 L535,60" stroke="#ffffff" stroke-width="0.7" opacity="0.7" />
  </g>

  <!-- Glowing Moon Halo & Crescent Moon -->
  <g transform="translate(370, 70)">
    <circle cx="80" cy="80" r="85" fill="url(#moonGlow_mc003)" />
    <!-- Golden Crescent Moon -->
    <path d="M100,35 C65,35 45,65 45,95 C45,125 65,150 100,150 C80,140 68,120 68,95 C68,70 80,48 100,35 Z" fill="#fff5d6" stroke="#ffe394" stroke-width="1" />
  </g>

  <!-- Distant Mountain / Forest Silhouette on Horizon -->
  <path d="M0,350 Q120,335 240,345 T480,340 T720,345 T900,340 L900,370 L0,370 Z" fill="#080c12" />

  <!-- Distant Coconut Palm & Banyan Trees Silhouettes -->
  <g fill="#070a0f" opacity="0.85">
    <!-- Palm 1 Left -->
    <path d="M110,345 Q115,280 120,240" stroke="#070a0f" stroke-width="3" fill="none" />
    <path d="M120,240 Q95,225 80,245" stroke="#070a0f" stroke-width="2" fill="none" />
    <path d="M120,240 Q130,220 150,235" stroke="#070a0f" stroke-width="2" fill="none" />
    <path d="M120,240 Q105,215 115,210" stroke="#070a0f" stroke-width="2" fill="none" />
    <path d="M120,240 Q140,230 145,255" stroke="#070a0f" stroke-width="2" fill="none" />
    <!-- Palm 2 Left -->
    <path d="M140,345 Q143,290 146,255" stroke="#070a0f" stroke-width="2.5" fill="none" />
    <path d="M146,255 Q125,240 115,260" stroke="#070a0f" stroke-width="1.8" fill="none" />
    <path d="M146,255 Q155,235 170,250" stroke="#070a0f" stroke-width="1.8" fill="none" />
    <!-- Distant Foliage Mound -->
    <ellipse cx="220" cy="345" rx="55" ry="25" />
    <ellipse cx="680" cy="345" rx="75" ry="28" />
  </g>

  <!-- Calm Meandering River Surface -->
  <polygon points="0,355 900,355 900,600 0,600" fill="url(#riverGrad_mc003)" />
  <line x1="0" y1="355" x2="900" y2="355" stroke="#1c2836" stroke-width="1.5" />

  <!-- Shimmering Moon River Reflections (Vertical Column of Light) -->
  <g stroke="#ffe394" stroke-linecap="round" opacity="0.45">
    <ellipse cx="445" cy="370" rx="35" ry="3" fill="url(#waterReflect_mc003)" stroke="none" />
    <line x1="435" y1="365" x2="455" y2="365" stroke-width="1.5" />
    <line x1="420" y1="375" x2="470" y2="375" stroke-width="1.8" />
    <line x1="410" y1="390" x2="480" y2="390" stroke-width="2.2" />
    <line x1="400" y1="410" x2="490" y2="410" stroke-width="2.5" />
    <line x1="390" y1="435" x2="505" y2="435" stroke-width="2.8" />
    <line x1="380" y1="465" x2="520" y2="465" stroke-width="3" />
    <line x1="370" y1="500" x2="535" y2="500" stroke-width="3.2" />
    <line x1="360" y1="540" x2="550" y2="540" stroke-width="3.5" opacity="0.35" />
  </g>

  <!-- Foreground Riverbank Mounds (Left & Right) -->
  <path d="M0,450 Q160,430 260,480 Q320,510 350,600 L0,600 Z" fill="#06090d" />
  <path d="M900,470 Q780,450 700,510 Q660,540 640,600 L900,600 Z" fill="#06090d" />

  <!-- Riverbank Tall Reeds / Grasses Silhouette -->
  <g stroke="#090d14" stroke-width="2" stroke-linecap="round">
    <path d="M40,460 Q50,420 45,390" />
    <path d="M55,465 Q65,430 75,405" />
    <path d="M75,475 Q80,440 90,415" />
    <path d="M120,470 Q130,440 125,410" />
    <path d="M140,480 Q155,450 160,425" />
    <path d="M820,480 Q810,440 815,410" />
    <path d="M850,470 Q840,430 830,400" />
  </g>

  <!-- Romantic Couple Silhouette Sitting Together by the Water -->
  <g transform="translate(190, 420)">
    <!-- Person 1 (Sitting, Arm around Person 2) -->
    <ellipse cx="40" cy="50" rx="9" ry="8" fill="#040608" />
    <path d="M30,58 C30,52 48,52 48,58 L46,95 L25,95 Z" fill="#040608" />
    <!-- Person 2 (Head Resting on Person 1's Shoulder) -->
    <ellipse cx="53" cy="53" rx="8" ry="7" fill="#040608" />
    <path d="M46,60 C46,55 60,55 60,60 L62,95 L44,95 Z" fill="#040608" />
  </g>

  <!-- Subtle Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc003)" />

  <!-- Double Frame Vintage Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.45" rx="6" />
  <rect x="33" y="33" width="834" height="534" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3" rx="4" />

  <!-- Ornate Corner Brackets -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Moon Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#0e1520" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">MIDNIGHT</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <path d="M46,42 C40,42 36,46 36,52 C36,58 40,62 46,62 C43,60 41,56 41,52 C41,48 43,44 46,42 Z" fill="#ffd166" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1954</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#a4bcd4">NIGHT POST</text>
    <!-- Postmark Cancellation Waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#080d14" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#080d14" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
