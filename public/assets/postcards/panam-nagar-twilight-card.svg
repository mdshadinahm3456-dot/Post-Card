<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Twilight Alley Sky Gradient -->
    <linearGradient id="twilightSky_mc020" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121024" />
      <stop offset="35%" stop-color="#231c3d" />
      <stop offset="70%" stop-color="#4a3152" />
      <stop offset="85%" stop-color="#804a55" />
      <stop offset="100%" stop-color="#bd6d53" />
    </linearGradient>

    <!-- Historic Heritage Brick Arch Gradient -->
    <linearGradient id="archGrad_mc020" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261715" />
      <stop offset="50%" stop-color="#1d100e" />
      <stop offset="100%" stop-color="#0f0706" />
    </linearGradient>

    <!-- Street Lantern Radial Glow -->
    <radialGradient id="lanternGlow_mc020" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4cc" stop-opacity="1" />
      <stop offset="25%" stop-color="#ffd56b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#e88523" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d100e" stop-opacity="0" />
    </radialGradient>

    <pattern id="grain_mc020" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Twilight Sky Beyond Archway -->
  <rect width="900" height="420" fill="url(#twilightSky_mc020)" />

  <!-- Evening Star (Venus) in Twilight Sky -->
  <circle cx="480" cy="140" r="3" fill="#ffffff" />
  <line x1="480" y1="130" x2="480" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.7" />
  <line x1="470" y1="140" x2="490" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.7" />

  <!-- Historic Heritage Town Architecture (Panam Nagar / Old Dhaka Street Archway) -->
  <!-- Giant Ancient Brick Arch Framing the Center View -->
  <!-- Left Column & Arch Side -->
  <path d="M0,0 L260,0 L260,180 C260,280 340,340 450,340 C340,340 260,280 260,180 L260,600 L0,600 Z" fill="url(#archGrad_mc020)" />
  <!-- Right Column & Arch Side -->
  <path d="M900,0 L640,0 L640,180 C640,280 560,340 450,340 C560,340 640,280 640,180 L640,600 L900,600 Z" fill="url(#archGrad_mc020)" />
  <!-- Arch Top Header Beam -->
  <path d="M260,180 C260,80 340,20 450,20 C560,20 640,80 640,180 Z" fill="none" stroke="#3d211a" stroke-width="24" />
  <path d="M260,180 C260,80 340,20 450,20 C560,20 640,80 640,180 Z" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5" />

  <!-- Brick Texture Imprints along Archway -->
  <g stroke="#381d17" stroke-width="1.2" opacity="0.6">
    <line x1="50" y1="100" x2="210" y2="100" />
    <line x1="120" y1="100" x2="120" y2="140" />
    <line x1="50" y1="140" x2="210" y2="140" />
    <line x1="70" y1="140" x2="70" y2="180" />
    <line x1="160" y1="140" x2="160" y2="180" />
    <line x1="50" y1="180" x2="210" y2="180" />

    <line x1="690" y1="100" x2="850" y2="100" />
    <line x1="770" y1="100" x2="770" y2="140" />
    <line x1="690" y1="140" x2="850" y2="140" />
    <line x1="720" y1="140" x2="720" y2="180" />
    <line x1="810" y1="140" x2="810" y2="180" />
    <line x1="690" y1="180" x2="850" y2="180" />
  </g>

  <!-- Old Street Cobblestone / Brick Pavement Through Archway -->
  <polygon points="260,370 640,370 700,600 200,600" fill="#170c0a" />
  <line x1="260" y1="370" x2="640" y2="370" stroke="#bd6d53" stroke-width="1.5" opacity="0.6" />
  <!-- Pavement Stones -->
  <g stroke="#261511" stroke-width="1" opacity="0.6">
    <line x1="240" y1="420" x2="660" y2="420" />
    <line x1="220" y1="480" x2="680" y2="480" />
    <line x1="200" y1="540" x2="700" y2="540" />
  </g>

  <!-- Vintage Traditional Rickshaw Silhouette Resting in the Alley -->
  <g transform="translate(360, 315)">
    <!-- Ground Shadow -->
    <ellipse cx="90" cy="110" rx="95" ry="18" fill="#0a0504" opacity="0.75" />

    <!-- Big Spoked Wheels -->
    <circle cx="130" cy="80" r="32" fill="none" stroke="#0a0504" stroke-width="2.5" />
    <circle cx="130" cy="80" r="3" fill="#0a0504" />
    <circle cx="30" cy="80" r="26" fill="none" stroke="#0a0504" stroke-width="2.5" />
    <circle cx="30" cy="80" r="3" fill="#0a0504" />

    <!-- Hood (Canopy) of the Rickshaw Upright -->
    <path d="M100,20 C100,0 155,0 160,35 L145,55 L90,55 Z" fill="#0a0504" />
    <path d="M90,55 C90,65 145,65 145,55 Z" fill="#0a0504" />
    <!-- Passenger Seat & Footrest -->
    <polygon points="90,55 145,55 140,75 85,75" fill="#0a0504" />

    <!-- Frame Tubes & Front Handlebars -->
    <line x1="130" y1="80" x2="65" y2="65" stroke="#0a0504" stroke-width="3" />
    <line x1="65" y1="65" x2="30" y2="80" stroke="#0a0504" stroke-width="3" />
    <line x1="30" y1="80" x2="30" y2="45" stroke="#0a0504" stroke-width="3" />
    <!-- Handlebar Crossbar -->
    <line x1="22" y1="45" x2="38" y2="45" stroke="#0a0504" stroke-width="3.5" stroke-linecap="round" />
    <!-- Rickshaw Bell on Handlebar -->
    <circle cx="35" cy="42" r="2.5" fill="#d4af37" />
  </g>

  <!-- Ornate Hanging Gas Lantern (Hanging from Keystone of Archway) -->
  <g transform="translate(450, 20)">
    <!-- Hanging Iron Chain -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#120907" stroke-width="2.5" stroke-dasharray="4 2" />

    <!-- Amber Glow Emanating into the Dusk Alley -->
    <circle cx="0" cy="110" r="150" fill="url(#lanternGlow_mc020)" />

    <!-- Lantern Top Cap -->
    <polygon points="-22,55 22,55 0,40" fill="#1f100c" stroke="#0f0706" stroke-width="1.2" />
    <circle cx="0" cy="38" r="3.5" fill="#d4af37" />

    <!-- Lantern Glass Hexagon Body -->
    <polygon points="-22,55 22,55 16,115 -16,115" fill="#ffd56b" opacity="0.35" stroke="#0f0706" stroke-width="2" />
    <line x1="0" y1="55" x2="0" y2="115" stroke="#0f0706" stroke-width="1.5" />

    <!-- Dancing Candle / Gas Flame -->
    <ellipse cx="0" cy="90" rx="6" ry="12" fill="#ffb703" />
    <ellipse cx="0" cy="92" rx="3" ry="6" fill="#ffffff" />

    <!-- Bottom Spire Finial -->
    <polygon points="-16,115 16,115 0,135" fill="#1f100c" stroke="#0f0706" stroke-width="1.2" />
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc020)" />

  <!-- Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Historic Town Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#1f121b" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">PANAM NAGAR</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Arch icon inside stamp -->
    <path d="M36,58 L36,50 C36,44 48,44 48,50 L48,58" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1954</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">TWILIGHT HOUR</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#0e070d" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#0e070d" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
