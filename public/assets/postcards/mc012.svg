<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Dark Oak Writing Desk Gradient -->
    <linearGradient id="oakDesk_mc012" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241510" />
      <stop offset="50%" stop-color="#190e0b" />
      <stop offset="100%" stop-color="#0e0705" />
    </linearGradient>

    <!-- Warm Candle Glow -->
    <radialGradient id="candleGlow_mc012" cx="30%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff0cc" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#190e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Leather Bound Diary Gradient -->
    <linearGradient id="leatherGrad_mc012" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1818" />
      <stop offset="50%" stop-color="#360f0f" />
      <stop offset="100%" stop-color="#220808" />
    </linearGradient>

    <pattern id="grain_mc012" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Dark Oak Tabletop -->
  <rect width="900" height="600" fill="url(#oakDesk_mc012)" />

  <!-- Wood Grains -->
  <g stroke="#120704" stroke-width="1.5" opacity="0.65">
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="310" x2="900" y2="310" />
    <line x1="0" y1="460" x2="900" y2="460" />
  </g>

  <!-- Candlelight Radial Beam in Upper-Left -->
  <circle cx="250" cy="180" r="320" fill="url(#candleGlow_mc012)" />

  <!-- Composition: Unsent Letter, Secret Diary, Red Rose & Candle -->
  <g transform="translate(140, 90)">
    <!-- Brass Candleholder with Dripping Candle (Upper Left) -->
    <g transform="translate(60, 40)">
      <!-- Candle Shadow -->
      <ellipse cx="40" cy="95" rx="30" ry="10" fill="#060302" opacity="0.5" />
      <!-- Brass Base -->
      <ellipse cx="40" cy="90" rx="26" ry="8" fill="#b08632" stroke="#5c4515" stroke-width="1.2" />
      <ellipse cx="40" cy="85" rx="14" ry="4" fill="#d4af37" />
      <!-- Candle Wax Column with Drips -->
      <path d="M34,85 L34,25 Q34,22 40,22 Q46,22 46,25 L46,85 Z" fill="#e8dac0" stroke="#a39274" stroke-width="0.8" />
      <!-- Wax Drips Down Side -->
      <path d="M34,35 Q32,45 34,55" fill="none" stroke="#e8dac0" stroke-width="2" />
      <path d="M46,40 Q48,50 46,60" fill="none" stroke="#e8dac0" stroke-width="2" />
      <!-- Flame -->
      <line x1="40" y1="22" x2="40" y2="14" stroke="#1c1209" stroke-width="1.5" />
      <ellipse cx="40" cy="8" rx="5" ry="10" fill="#ff9f1c" />
      <ellipse cx="40" cy="10" rx="2" ry="5" fill="#ffffff" />
    </g>

    <!-- Vintage Leather-Bound Secret Diary (Turned Slightly) -->
    <g transform="translate(180, 50) rotate(-8)">
      <!-- Diary Shadow -->
      <rect x="15" y="15" width="220" height="280" rx="6" fill="#060302" opacity="0.6" />
      <!-- Diary Cover Body -->
      <rect x="0" y="0" width="220" height="280" rx="6" fill="url(#leatherGrad_mc012)" stroke="#591818" stroke-width="2" />
      <!-- Gold Embossed Corner Protectors -->
      <polygon points="0,0 35,0 0,35" fill="#d4af37" stroke="#7a6223" stroke-width="0.8" />
      <polygon points="220,0 185,0 220,35" fill="#d4af37" stroke="#7a6223" stroke-width="0.8" />
      <polygon points="0,280 35,280 0,245" fill="#d4af37" stroke="#7a6223" stroke-width="0.8" />
      <polygon points="220,280 185,280 220,245" fill="#d4af37" stroke="#7a6223" stroke-width="0.8" />
      <!-- Embossed Oval Filigree on Cover -->
      <ellipse cx="110" cy="140" rx="45" ry="60" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.6" stroke-dasharray="4 2" />
      <!-- Red Silk Ribbon Page Marker Hanging Out -->
      <path d="M110,270 Q115,310 135,330" fill="none" stroke="#941924" stroke-width="7" stroke-linecap="round" />
      <path d="M110,270 Q115,310 135,330" fill="none" stroke="#ffd166" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Unsent Sealed Letter Overlapping the Diary (Right Foreground) -->
    <g transform="translate(320, 110) rotate(9)">
      <!-- Letter Shadow -->
      <polygon points="12,12 292,12 292,192 12,192" fill="#060302" opacity="0.55" />
      <!-- Vintage Cream Envelope -->
      <polygon points="0,0 280,0 280,180 0,180" fill="#eddcc4" stroke="#bda88c" stroke-width="1.5" rx="3" />
      <!-- Envelope Flap Creases -->
      <line x1="0" y1="0" x2="140" y2="105" stroke="#a38f74" stroke-width="1.2" />
      <line x1="280" y1="0" x2="140" y2="105" stroke="#a38f74" stroke-width="1.2" />

      <!-- Deep Crimson Wax Seal Holding Envelope Closed -->
      <circle cx="140" cy="105" r="22" fill="#7a141c" stroke="#520a10" stroke-width="2" />
      <circle cx="140" cy="105" r="16" fill="#8c1b24" />
      <!-- Wax Seal Monogram Heart Impression -->
      <path d="M136,102 C136,98 144,98 144,102 C144,108 140,111 140,111 C140,111 136,108 136,102 Z" fill="#ffd166" opacity="0.8" />

      <!-- Note: NO RECIPIENT NAME written (Unspoken, unsent love) -->
      <!-- Soft pencil mark line -->
      <line x1="60" y1="145" x2="160" y2="145" stroke="#ab9982" stroke-width="1" stroke-dasharray="3 3" />
    </g>

    <!-- Solitary Deep Crimson Rose Resting on Desk -->
    <g transform="translate(240, 220) rotate(-18)">
      <!-- Stem Shadow -->
      <path d="M45,55 Q65,115 85,175" fill="none" stroke="#060302" stroke-width="4" opacity="0.45" />
      <!-- Rose Stem -->
      <path d="M42,52 Q62,112 82,172" fill="none" stroke="#2b3b20" stroke-width="3" stroke-linecap="round" />
      <polygon points="56,95 58,98 52,100" fill="#4a3626" />
      <path d="M62,110 Q80,98 85,115 Q72,118 62,110 Z" fill="#24331a" />
      <!-- Velvet Petals -->
      <ellipse cx="26" cy="36" rx="20" ry="17" fill="#570d14" />
      <path d="M10,32 C10,16 42,16 42,32 C42,46 10,46 10,32 Z" fill="#7a141d" />
      <path d="M16,28 C18,18 34,18 36,28 C34,38 18,38 16,28 Z" fill="#9e1e2b" />
      <ellipse cx="26" cy="24" rx="4" ry="3" fill="#ba2837" />
    </g>

    <!-- Vintage Fountain Pen on Desk (Lower Right) -->
    <g transform="translate(480, 240) rotate(42)">
      <rect x="0" y="0" width="11" height="140" rx="4" fill="#140f0c" stroke="#3d2d20" stroke-width="1" />
      <rect x="0" y="25" width="11" height="3" fill="#d4af37" />
      <rect x="0" y="105" width="11" height="4" fill="#d4af37" />
      <polygon points="1,128 10,128 5.5,148" fill="#ffd166" stroke="#997b26" stroke-width="0.8" />
      <line x1="5.5" y1="128" x2="5.5" y2="144" stroke="#140f0c" stroke-width="0.8" />
    </g>
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc012)" />

  <!-- Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Unspoken Love Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#1c0f0c" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">SECRETS</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Wax seal impression inside stamp -->
    <circle cx="42" cy="52" r="8" fill="#8c1b24" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1954</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">UNSPOKEN</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#100705" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#100705" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
