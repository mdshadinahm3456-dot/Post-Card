<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Warm Sepia Parchment Canvas Gradient -->
    <linearGradient id="bgGrad_mc004" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f18" />
      <stop offset="40%" stop-color="#211712" />
      <stop offset="80%" stop-color="#19110d" />
      <stop offset="100%" stop-color="#120c09" />
    </linearGradient>

    <!-- Warm Amber Glow Behind Rose -->
    <radialGradient id="roseGlow_mc004" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffcf87" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#cf7a4a" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#211712" stop-opacity="0" />
    </radialGradient>

    <!-- Cream Letter Paper -->
    <linearGradient id="letterGrad_mc004" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f0e1" />
      <stop offset="60%" stop-color="#ebdcc2" />
      <stop offset="100%" stop-color="#dcccae" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad_mc004" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a1a24" />
      <stop offset="50%" stop-color="#ba2b38" />
      <stop offset="100%" stop-color="#69121a" />
    </linearGradient>

    <pattern id="grain_mc004" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="21" cy="9" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad_mc004)" />

  <!-- Soft Warm Light Halo -->
  <circle cx="450" cy="240" r="280" fill="url(#roseGlow_mc004)" />

  <!-- Composition: Folded Letter, Vintage Envelope, Red Rose & Ribbon -->
  <g transform="translate(180, 80)">
    <!-- Vintage Envelope Tilted in Background -->
    <g transform="translate(60, 60) rotate(-6)">
      <polygon points="20,20 280,20 280,180 20,180" fill="#0c0806" opacity="0.45" />
      <polygon points="15,15 275,15 275,175 15,175" fill="#e0ceb1" stroke="#b09c7d" stroke-width="1.2" rx="2" />
      <!-- Envelope Flap Creases -->
      <line x1="15" y1="15" x2="145" y2="105" stroke="#9d896c" stroke-width="1" />
      <line x1="275" y1="15" x2="145" y2="105" stroke="#9d896c" stroke-width="1" />
      <!-- Air Mail Chevron Borders -->
      <line x1="20" y1="18" x2="35" y2="18" stroke="#9e2a2b" stroke-width="3" />
      <line x1="40" y1="18" x2="55" y2="18" stroke="#2b4c6f" stroke-width="3" />
      <line x1="60" y1="18" x2="75" y2="18" stroke="#9e2a2b" stroke-width="3" />
    </g>

    <!-- Folded Love Letter (Parchment) -->
    <g transform="translate(120, 90) rotate(5)">
      <polygon points="15,15 325,15 325,235 15,235" fill="#0a0705" opacity="0.5" />
      <polygon points="10,10 320,10 320,230 10,230" fill="url(#letterGrad_mc004)" stroke="#bfae91" stroke-width="1.2" rx="3" />
      <!-- Faint Calligraphy Lines -->
      <g stroke="#42342b" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
        <path d="M40,40 Q70,37 120,40 T180,38 T240,40 T290,38" />
        <path d="M40,65 Q80,62 140,65 T200,63 T260,65 T295,63" />
        <path d="M40,90 Q60,87 110,90 T170,88 T230,90 T280,88" />
        <path d="M40,115 Q90,112 150,115 T210,113 T270,115" />
        <path d="M40,140 Q60,137 120,140 T180,138 T240,140" />
      </g>
    </g>

    <!-- Crimson Silk Ribbon Flowing Across Letter -->
    <g transform="translate(140, 160)">
      <path d="M-40,90 Q80,20 200,60 T380,30" fill="none" stroke="url(#ribbonGrad_mc004)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
      <path d="M-40,90 Q80,20 200,60 T380,30" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5" stroke-dasharray="6 3" />
      <!-- Ribbon Bow Knot -->
      <ellipse cx="190" cy="55" rx="14" ry="10" fill="#78141d" stroke="#520c13" stroke-width="1.5" />
      <path d="M190,55 Q160,20 145,45 Q165,55 190,55 Z" fill="#9e1e2b" />
      <path d="M190,55 Q220,20 235,45 Q215,55 190,55 Z" fill="#9e1e2b" />
    </g>

    <!-- Blooming Vintage Red Rose (Central Artwork) -->
    <g transform="translate(230, 110)">
      <!-- Stem Shadow -->
      <path d="M45,75 Q65,145 85,215" fill="none" stroke="#0b0604" stroke-width="4.5" opacity="0.45" />
      <!-- Stem with Thorns -->
      <path d="M42,72 Q62,142 82,212" fill="none" stroke="#2a381c" stroke-width="3.5" stroke-linecap="round" />
      <polygon points="56,115 58,118 51,120" fill="#4d3a2b" />
      <polygon points="68,160 70,163 63,165" fill="#4d3a2b" />
      <!-- Dark Olive Green Rose Leaves -->
      <path d="M54,128 Q78,115 85,135 Q68,140 54,128 Z" fill="#243017" stroke="#18220f" stroke-width="1" />
      <line x1="54" y1="128" x2="80" y2="132" stroke="#3b4d27" stroke-width="0.8" />
      <path d="M68,172 Q45,162 42,182 Q60,183 68,172 Z" fill="#243017" stroke="#18220f" stroke-width="1" />
      <line x1="68" y1="172" x2="46" y2="178" stroke="#3b4d27" stroke-width="0.8" />

      <!-- Rose Blossom Petals (Rich Sculpted Layers) -->
      <g transform="translate(0, 10)">
        <!-- Outer Sepals -->
        <path d="M15,45 Q5,25 25,35" fill="none" stroke="#243017" stroke-width="2" />
        <path d="M65,45 Q75,25 55,35" fill="none" stroke="#243017" stroke-width="2" />
        <!-- Base Shadow -->
        <ellipse cx="40" cy="45" rx="30" ry="24" fill="#400a10" opacity="0.6" />
        <!-- Outer Velvet Petals -->
        <path d="M15,35 C10,10 68,10 65,35 C68,55 10,55 15,35 Z" fill="#690f18" stroke="#4a0910" stroke-width="1" />
        <path d="M22,30 C18,12 60,12 58,30 C60,46 18,46 22,30 Z" fill="#8c1824" />
        <path d="M28,26 C25,12 53,12 51,26 C53,38 25,38 28,26 Z" fill="#b02432" />
        <!-- Heart / Core Petals -->
        <path d="M33,22 C30,14 48,14 46,22 C48,30 30,30 33,22 Z" fill="#c73241" />
        <ellipse cx="39" cy="22" rx="4" ry="3" fill="#df4858" />
      </g>
    </g>
  </g>

  <!-- Fine Grain -->
  <rect width="900" height="600" fill="url(#grain_mc004)" />

  <!-- Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#1e140f" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">ROMANCE</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Rose silhouette inside stamp -->
    <path d="M38,50 C36,44 48,44 46,50 C48,56 36,56 38,50 Z" fill="#ba2b38" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">V-19</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">RED ROSE</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#120906" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#120906" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
