<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Autumn Sunset Sky Gradient -->
    <linearGradient id="autumnSky_mc021" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261017" />
      <stop offset="30%" stop-color="#5e1c23" />
      <stop offset="60%" stop-color="#993d24" />
      <stop offset="85%" stop-color="#db7a2c" />
      <stop offset="100%" stop-color="#f5b94e" />
    </linearGradient>

    <!-- Warm Glowing Autumn Sun on Horizon -->
    <radialGradient id="sunAutumn_mc021" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffced" stop-opacity="1" />
      <stop offset="25%" stop-color="#ffd56b" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#e86b23" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#5e1c23" stop-opacity="0" />
    </radialGradient>

    <!-- Autumn River Water Gradient -->
    <linearGradient id="riverGrad_mc021" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#db7a2c" />
      <stop offset="35%" stop-color="#803819" />
      <stop offset="70%" stop-color="#3d180b" />
      <stop offset="100%" stop-color="#140804" />
    </linearGradient>

    <pattern id="grain_mc021" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#ffe099" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Autumn Sky Canvas -->
  <rect width="900" height="360" fill="url(#autumnSky_mc021)" />

  <!-- Huge Glowing Autumn Sun Setting on the River Horizon -->
  <g transform="translate(620, 260)">
    <circle cx="0" cy="0" r="150" fill="url(#sunAutumn_mc021)" />
    <circle cx="0" cy="0" r="48" fill="#fff9ea" stroke="#ffd56b" stroke-width="2" />
  </g>

  <!-- Distant Birds Flying South in V-Formation -->
  <g stroke="#260f15" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M280,110 Q286,104 292,110 Q298,104 304,110" />
    <path d="M310,95 Q315,90 320,95 Q325,90 330,95" />
    <path d="M335,115 Q340,110 345,115 Q350,110 355,115" />
    <path d="M360,105 Q364,101 368,105 Q372,101 376,105" />
  </g>

  <!-- Distant Serene River Horizon & Shoreline Silhouette -->
  <path d="M0,320 Q280,310 560,318 T900,315 L900,360 L0,360 Z" fill="#29110a" />

  <!-- Calm Autumn River (শরতের শান্ত নদী) -->
  <polygon points="0,325 900,325 900,600 0,600" fill="url(#riverGrad_mc021)" />
  <!-- Golden Water Shimmer Line -->
  <line x1="0" y1="325" x2="900" y2="325" stroke="#f5b94e" stroke-width="2" opacity="0.7" />

  <!-- Small Wooden Country Boat Drifting on Horizon (Right Center) -->
  <g transform="translate(480, 310)">
    <!-- Slender Crescent Boat Hull -->
    <path d="M0,20 Q40,32 80,20 Q60,35 20,35 Z" fill="#140704" />
    <!-- Boat Canopy (Golui / Chhoi) -->
    <path d="M25,22 C25,8 55,8 55,22 Z" fill="#140704" />
    <!-- Boatman Standing with Long Oar -->
    <circle cx="20" cy="14" r="3.5" fill="#140704" />
    <line x1="20" y1="16" x2="19" y2="28" stroke="#140704" stroke-width="2" />
    <line x1="16" y1="18" x2="6" y2="36" stroke="#140704" stroke-width="1.8" stroke-linecap="round" />
    <!-- Reflection in River -->
    <ellipse cx="40" cy="40" rx="35" ry="4" fill="#080302" opacity="0.5" />
  </g>

  <!-- Hero Feature: Swaying Bengal Kashful (Feathery White Plumes / কাশফুল) in Foreground -->
  <!-- Silhouetted Riverbank Muddy Shoreline (Left & Lower) -->
  <path d="M0,420 Q180,390 380,440 T900,480 L900,600 L0,600 Z" fill="#120603" />

  <!-- Dense Stands of Kashful Plants Swaying in Autumn Wind -->
  <!-- Stems (Gracefully Bending Slender Reeds) -->
  <g stroke="#ffd56b" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M60,600 Q90,440 120,310" />
    <path d="M90,600 Q130,420 160,280" />
    <path d="M120,600 Q165,450 190,330" />
    <path d="M150,600 Q190,410 230,260" />
    <path d="M190,600 Q240,430 270,300" />
    <path d="M230,600 Q270,400 320,270" />
    <path d="M280,600 Q330,440 370,320" />
    <path d="M340,600 Q380,450 420,340" />

    <!-- Right Bank Clusters -->
    <path d="M720,600 Q740,460 760,350" />
    <path d="M760,600 Q790,430 820,310" />
    <path d="M810,600 Q835,450 860,330" />
  </g>

  <!-- Feathery Silky White Kashful Plumes (কাশফুলের নরম সাদা ফুল) -->
  <g fill="#fdfbf4" opacity="0.85">
    <!-- Plume 1 -->
    <path d="M120,310 Q140,290 125,270 Q110,290 120,310 Z" />
    <ellipse cx="125" cy="285" rx="7" ry="24" transform="rotate(18, 125, 285)" />
    <!-- Plume 2 (Taller, Majestic) -->
    <path d="M160,280 Q185,250 168,230 Q150,250 160,280 Z" />
    <ellipse cx="168" cy="250" rx="8" ry="30" transform="rotate(22, 168, 250)" />
    <!-- Plume 3 -->
    <ellipse cx="195" cy="305" rx="7" ry="25" transform="rotate(15, 195, 305)" />
    <!-- Plume 4 (Tallest, catching sunset golden glow) -->
    <ellipse cx="238" cy="235" rx="9" ry="34" transform="rotate(25, 238, 235)" fill="#fff5d9" />
    <!-- Plume 5 -->
    <ellipse cx="278" cy="275" rx="8" ry="28" transform="rotate(20, 278, 275)" />
    <!-- Plume 6 -->
    <ellipse cx="328" cy="245" rx="8" ry="28" transform="rotate(26, 328, 245)" fill="#fff5d9" />
    <!-- Plume 7 -->
    <ellipse cx="378" cy="295" rx="7" ry="24" transform="rotate(18, 378, 295)" />
    <!-- Plume 8 -->
    <ellipse cx="426" cy="318" rx="6" ry="20" transform="rotate(15, 426, 318)" />

    <!-- Right Side Plumes -->
    <ellipse cx="765" cy="325" rx="7" ry="24" transform="rotate(-15, 765, 325)" />
    <ellipse cx="828" cy="285" rx="8" ry="28" transform="rotate(-20, 828, 285)" fill="#fff5d9" />
    <ellipse cx="866" cy="305" rx="7" ry="24" transform="rotate(-16, 866, 305)" />
  </g>

  <!-- Feathery Soft Fluff Fibers Along Plumes -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.6" stroke-linecap="round">
    <line x1="168" y1="240" x2="180" y2="235" />
    <line x1="168" y1="250" x2="182" y2="246" />
    <line x1="168" y1="260" x2="180" y2="258" />
    <line x1="238" y1="225" x2="252" y2="220" />
    <line x1="238" y1="235" x2="254" y2="231" />
    <line x1="238" y1="245" x2="252" y2="243" />
    <line x1="328" y1="235" x2="342" y2="230" />
    <line x1="328" y1="245" x2="344" y2="241" />
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc021)" />

  <!-- Vintage Ornate Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Kashful Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#241219" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">SHARAT</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Kashful reed icon in stamp -->
    <path d="M38,62 Q42,52 46,42" stroke="#d4af37" stroke-width="1.5" fill="none" />
    <ellipse cx="46" cy="42" rx="3" ry="8" fill="#fff5d9" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1954</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">KASHFUL LOVE</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#12080c" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#12080c" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
