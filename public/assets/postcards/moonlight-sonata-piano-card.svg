<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Midnight Moonlight Sky Gradient -->
    <linearGradient id="nightSky_mc023" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c101a" />
      <stop offset="35%" stop-color="#141a29" />
      <stop offset="70%" stop-color="#1d263b" />
      <stop offset="100%" stop-color="#2a3854" />
    </linearGradient>

    <!-- Glowing Crescent Moon Radiance -->
    <radialGradient id="moonGlow_mc023" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf4" stop-opacity="1" />
      <stop offset="30%" stop-color="#d6e8ff" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#587ea8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#141a29" stop-opacity="0" />
    </radialGradient>

    <!-- Moonlight Beam Streaming Diagonally -->
    <linearGradient id="moonBeam_mc023" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#d6e8ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0c101a" stop-opacity="0" />
    </linearGradient>

    <!-- Piano Polish Reflective Gradient -->
    <linearGradient id="pianoBody_mc023" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="40%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <pattern id="grain_mc023" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.04" />
      <circle cx="23" cy="11" r="0.6" fill="#000000" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Midnight Sky Canvas -->
  <rect width="900" height="600" fill="url(#nightSky_mc023)" />

  <!-- Stars in the Midnight Sky -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="180" cy="140" r="1" />
    <circle cx="240" cy="70" r="2" />
    <circle cx="310" cy="110" r="1.2" />
    <circle cx="580" cy="90" r="1.5" />
    <circle cx="670" cy="60" r="2" />
    <circle cx="780" cy="110" r="1" />
    <circle cx="830" cy="70" r="1.8" />
    <circle cx="730" cy="170" r="1.2" />
  </g>

  <!-- Glowing Crescent Moon in Upper Left -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="130" fill="url(#moonGlow_mc023)" />
    <!-- Crescent Moon Shape -->
    <path d="M-15,-40 A45,45 0 0,0 -15,40 A36,36 0 0,1 -15,-40 Z" fill="#fffdfa" stroke="#d6e8ff" stroke-width="1.5" />
    <!-- Soft Craters Texture -->
    <circle cx="-24" cy="-5" r="4" fill="#e0e8f2" opacity="0.5" />
    <circle cx="-28" cy="12" r="3" fill="#e0e8f2" opacity="0.5" />
  </g>

  <!-- Dramatic Stream of Pale Moonlight Shone Diagonally Across Room -->
  <polygon points="120,40 260,40 780,600 420,600" fill="url(#moonBeam_mc023)" />

  <!-- Floor Surface -->
  <line x1="0" y1="420" x2="900" y2="420" stroke="#080b12" stroke-width="2" />
  <polygon points="0,420 900,420 900,600 0,600" fill="#080b12" />
  <!-- Wooden Parquet Floor Planks Reflecting Moonlight -->
  <g stroke="#161f30" stroke-width="1" opacity="0.45">
    <line x1="0" y1="475" x2="900" y2="475" />
    <line x1="0" y1="535" x2="900" y2="535" />
  </g>

  <!-- Composition: Vintage Piano Silhouette, Sheet Music, Crimson Rose & Candle -->
  <g transform="translate(240, 160)">
    <!-- Piano Cast Floor Shadow -->
    <ellipse cx="180" cy="285" rx="190" ry="35" fill="#030406" opacity="0.8" />

    <!-- Vintage Piano Upright / Grand Case Body -->
    <polygon points="40,90 320,90 320,230 40,230" fill="url(#pianoBody_mc023)" stroke="#262f40" stroke-width="2" rx="4" />
    <!-- Upper Music Desk Lid -->
    <polygon points="30,80 330,80 320,90 40,90" fill="#2d374a" stroke="#10141c" stroke-width="1" />
    <line x1="30" y1="80" x2="330" y2="80" stroke="#d4af37" stroke-width="1.2" opacity="0.6" />

    <!-- Keyboard Shelf & Key Bed -->
    <polygon points="20,180 340,180 340,215 20,215" fill="#141924" stroke="#2b3445" stroke-width="1.5" />

    <!-- Piano White Keys (Ivory Keys Reflecting Moonlight) -->
    <g fill="#f5f0e6" stroke="#1d222e" stroke-width="0.8">
      <rect x="35" y="185" width="8" height="28" />
      <rect x="43" y="185" width="8" height="28" />
      <rect x="51" y="185" width="8" height="28" />
      <rect x="59" y="185" width="8" height="28" />
      <rect x="67" y="185" width="8" height="28" />
      <rect x="75" y="185" width="8" height="28" />
      <rect x="83" y="185" width="8" height="28" />
      <rect x="91" y="185" width="8" height="28" />
      <rect x="99" y="185" width="8" height="28" />
      <rect x="107" y="185" width="8" height="28" />
      <rect x="115" y="185" width="8" height="28" />
      <rect x="123" y="185" width="8" height="28" />
      <rect x="131" y="185" width="8" height="28" />
      <rect x="139" y="185" width="8" height="28" />
      <rect x="147" y="185" width="8" height="28" />
      <rect x="155" y="185" width="8" height="28" />
      <rect x="163" y="185" width="8" height="28" />
      <rect x="171" y="185" width="8" height="28" />
      <rect x="179" y="185" width="8" height="28" />
      <rect x="187" y="185" width="8" height="28" />
      <rect x="195" y="185" width="8" height="28" />
      <rect x="203" y="185" width="8" height="28" />
      <rect x="211" y="185" width="8" height="28" />
      <rect x="219" y="185" width="8" height="28" />
      <rect x="227" y="185" width="8" height="28" />
      <rect x="235" y="185" width="8" height="28" />
      <rect x="243" y="185" width="8" height="28" />
      <rect x="251" y="185" width="8" height="28" />
      <rect x="259" y="185" width="8" height="28" />
      <rect x="267" y="185" width="8" height="28" />
      <rect x="275" y="185" width="8" height="28" />
      <rect x="283" y="185" width="8" height="28" />
      <rect x="291" y="185" width="8" height="28" />
      <rect x="299" y="185" width="8" height="28" />
      <rect x="307" y="185" width="8" height="28" />
      <rect x="315" y="185" width="8" height="28" />
    </g>

    <!-- Piano Black Keys (Ebony) -->
    <g fill="#080a0e">
      <rect x="40" y="185" width="5.5" height="17" />
      <rect x="48" y="185" width="5.5" height="17" />
      <rect x="64" y="185" width="5.5" height="17" />
      <rect x="72" y="185" width="5.5" height="17" />
      <rect x="80" y="185" width="5.5" height="17" />
      <rect x="96" y="185" width="5.5" height="17" />
      <rect x="104" y="185" width="5.5" height="17" />
      <rect x="120" y="185" width="5.5" height="17" />
      <rect x="128" y="185" width="5.5" height="17" />
      <rect x="136" y="185" width="5.5" height="17" />
      <rect x="152" y="185" width="5.5" height="17" />
      <rect x="160" y="185" width="5.5" height="17" />
      <rect x="176" y="185" width="5.5" height="17" />
      <rect x="184" y="185" width="5.5" height="17" />
      <rect x="192" y="185" width="5.5" height="17" />
      <rect x="208" y="185" width="5.5" height="17" />
      <rect x="216" y="185" width="5.5" height="17" />
      <rect x="232" y="185" width="5.5" height="17" />
      <rect x="240" y="185" width="5.5" height="17" />
      <rect x="248" y="185" width="5.5" height="17" />
      <rect x="264" y="185" width="5.5" height="17" />
      <rect x="272" y="185" width="5.5" height="17" />
      <rect x="288" y="185" width="5.5" height="17" />
      <rect x="296" y="185" width="5.5" height="17" />
      <rect x="304" y="185" width="5.5" height="17" />
    </g>

    <!-- Piano Legs & Lyre Pedals -->
    <rect x="50" y="215" width="16" height="65" fill="#0b0d13" stroke="#1d222e" stroke-width="1.2" />
    <rect x="294" y="215" width="16" height="65" fill="#0b0d13" stroke="#1d222e" stroke-width="1.2" />
    <!-- Brass Pedals -->
    <rect x="170" y="268" width="6" height="12" fill="#ffd56b" stroke="#7a5a18" stroke-width="0.8" />
    <rect x="180" y="268" width="6" height="12" fill="#ffd56b" stroke="#7a5a18" stroke-width="0.8" />

    <!-- Open Sheet Music Propped on Music Stand (Upper Center) -->
    <g transform="translate(130, 95)">
      <!-- Sheet Music Score Pages -->
      <polygon points="0,5 50,0 50,60 0,65" fill="#f5ede1" stroke="#bda682" stroke-width="1" />
      <polygon points="50,0 100,5 100,65 50,60" fill="#f5ede1" stroke="#bda682" stroke-width="1" />
      <!-- Music Staves & Notes -->
      <g stroke="#3d2f20" stroke-width="0.7" opacity="0.6">
        <line x1="8" y1="18" x2="42" y2="15" />
        <line x1="8" y1="23" x2="42" y2="20" />
        <line x1="8" y1="28" x2="42" y2="25" />
        <line x1="58" y1="15" x2="92" y2="18" />
        <line x1="58" y1="20" x2="92" y2="23" />
        <line x1="58" y1="25" x2="92" y2="28" />
        <!-- Musical notes -->
        <circle cx="20" cy="20" r="1.8" fill="#3d2f20" />
        <line x1="21.8" y1="20" x2="21.8" y2="12" />
        <circle cx="32" cy="25" r="1.8" fill="#3d2f20" />
        <line x1="33.8" y1="25" x2="33.8" y2="17" />
        <circle cx="70" cy="22" r="1.8" fill="#3d2f20" />
        <line x1="71.8" y1="22" x2="71.8" y2="14" />
        <circle cx="82" cy="18" r="1.8" fill="#3d2f20" />
        <line x1="83.8" y1="18" x2="83.8" y2="10" />
      </g>
    </g>

    <!-- Single Velvet Crimson Rose Resting on Piano Keys (Right Side) -->
    <g transform="translate(230, 182) rotate(-8)">
      <!-- Rose Stem -->
      <path d="M15,10 Q45,18 75,20" fill="none" stroke="#24331a" stroke-width="2.5" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M35,14 Q48,6 45,18 Z" fill="#1b2915" />
      <!-- Velvet Blossom -->
      <circle cx="12" cy="8" r="10" fill="#570d14" />
      <circle cx="10" cy="7" r="7" fill="#8c1b26" />
      <circle cx="9" cy="6" r="4" fill="#ab2432" />
      <!-- Fallen Petal on Keys -->
      <ellipse cx="30" cy="22" rx="4" ry="2" fill="#8c1b26" transform="rotate(20, 30, 22)" />
    </g>
  </g>

  <!-- Film Grain Overlay -->
  <rect width="900" height="600" fill="url(#grain_mc023)" />

  <!-- Double Frame Vintage Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55" rx="6" />
  <rect x="33" y="33" width="834" height="534" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Vintage Moonlight Sonata Postage Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#141a29" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">SONATA</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Music note / crescent moon icon inside stamp -->
    <path d="M38,58 A6,6 0 0,0 44,52 L44,44 L48,44" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="38" cy="54" r="2.5" fill="#ffd56b" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">MIDNIGHT</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#a6bad4">MOONLIGHT</text>
    <!-- Cancellation waves -->
    <path d="M-25,30 Q-10,20 5,30 T35,30 T65,30 T95,30" fill="none" stroke="#080d14" stroke-width="1.8" opacity="0.75" />
    <path d="M-25,50 Q-10,40 5,50 T35,50 T65,50 T95,50" fill="none" stroke="#080d14" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
