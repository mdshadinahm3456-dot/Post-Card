<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Background & Street Gradients -->
    <linearGradient id="skyGrad_mc001" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a22" />
      <stop offset="50%" stop-color="#1c242d" />
      <stop offset="85%" stop-color="#2a231e" />
      <stop offset="100%" stop-color="#191410" />
    </linearGradient>

    <radialGradient id="lampGlow_mc001" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f5a623" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#141a22" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wetRoadGrad_mc001" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1a17" />
      <stop offset="30%" stop-color="#161311" />
      <stop offset="70%" stop-color="#110d0b" />
      <stop offset="100%" stop-color="#0a0807" />
    </linearGradient>

    <linearGradient id="reflectionGrad_mc001" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#110d0b" stop-opacity="0" />
    </linearGradient>

    <!-- Vintage Film Grain Pattern -->
    <pattern id="grain_mc001" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="0.7" fill="#d4af37" opacity="0.08" />
      <circle cx="18" cy="22" r="0.9" fill="#ffffff" opacity="0.05" />
      <circle cx="27" cy="11" r="0.6" fill="#000000" opacity="0.12" />
      <circle cx="12" cy="28" r="0.8" fill="#d4af37" opacity="0.06" />
    </pattern>

    <!-- Vintage Scratches Pattern -->
    <pattern id="scratches_mc001" width="120" height="120" patternUnits="userSpaceOnUse">
      <line x1="10" y1="20" x2="35" y2="80" stroke="#f8edd6" stroke-width="0.5" opacity="0.04" />
      <line x1="80" y1="10" x2="95" y2="45" stroke="#000000" stroke-width="0.6" opacity="0.07" />
      <line x1="45" y1="90" x2="110" y2="105" stroke="#d4af37" stroke-width="0.4" opacity="0.05" />
    </pattern>
  </defs>

  <!-- Sky and Atmospheric Background -->
  <rect width="900" height="600" fill="url(#skyGrad_mc001)" />

  <!-- Distant Old Colonial City Skyline in Rain Fog -->
  <g opacity="0.35" fill="#13181f">
    <rect x="30" y="240" width="70" height="150" />
    <rect x="75" y="210" width="85" height="180" />
    <polygon points="75,210 117,165 160,210" />
    <rect x="180" y="260" width="90" height="130" />
    <rect x="290" y="230" width="110" height="160" />
    <!-- Distant trees in mist -->
    <path d="M420,380 C440,320 480,310 510,340 C540,300 590,320 610,380 Z" opacity="0.6" fill="#18201a" />
    <rect x="630" y="250" width="95" height="140" />
    <rect x="740" y="220" width="130" height="170" />
    <polygon points="770,220 805,170 840,220" />
  </g>

  <!-- Wet Street Ground with Horizon Line -->
  <polygon points="0,370 900,370 900,600 0,600" fill="url(#wetRoadGrad_mc001)" />
  <line x1="0" y1="370" x2="900" y2="370" stroke="#3b322a" stroke-width="1.5" opacity="0.5" />

  <!-- Street Lamp Light Cone & Glowing Atmosphere -->
  <ellipse cx="360" cy="190" rx="160" ry="160" fill="url(#lampGlow_mc001)" />
  <!-- Puddle & Road Light Reflections -->
  <ellipse cx="360" cy="440" rx="130" ry="24" fill="url(#reflectionGrad_mc001)" />
  <ellipse cx="440" cy="485" rx="180" ry="18" fill="url(#reflectionGrad_mc001)" opacity="0.6" />
  <ellipse cx="310" cy="515" rx="90" ry="12" fill="url(#reflectionGrad_mc001)" opacity="0.4" />

  <!-- Vintage Ornate Cast Iron Street Lamp -->
  <g transform="translate(320, 110)">
    <!-- Base & Pedestal -->
    <polygon points="35,260 45,260 43,210 37,210" fill="#1b1612" stroke="#4a3c30" stroke-width="1" />
    <!-- Fluted Pole -->
    <line x1="40" y1="210" x2="40" y2="70" stroke="#231c17" stroke-width="5" />
    <line x1="40" y1="210" x2="40" y2="70" stroke="#d4af37" stroke-width="1" opacity="0.3" />
    <!-- Ornate Bracket -->
    <path d="M40,110 C55,90 65,70 65,50 C65,40 55,35 40,40" fill="none" stroke="#231c17" stroke-width="2.5" />
    <path d="M40,110 C25,90 15,70 15,50 C15,40 25,35 40,40" fill="none" stroke="#231c17" stroke-width="2.5" />
    <!-- Lantern Fixture -->
    <polygon points="25,45 55,45 48,15 32,15" fill="#f5c252" fill-opacity="0.8" stroke="#16120e" stroke-width="2" />
    <circle cx="40" cy="30" r="10" fill="#ffffff" opacity="0.9" />
    <!-- Lantern Roof & Spire -->
    <polygon points="20,15 60,15 40,0" fill="#1b1612" stroke="#4a3c30" stroke-width="1.5" />
    <circle cx="40" cy="0" r="2.5" fill="#d4af37" />
  </g>

  <!-- Two Lovers Silhouette Under One Umbrella -->
  <g transform="translate(420, 310)">
    <!-- Wet Road Reflections of the Couple -->
    <ellipse cx="50" cy="115" rx="35" ry="8" fill="#0d0a08" opacity="0.75" />

    <!-- Two Silhouettes Standing Close -->
    <!-- Person 1 (Taller - Left) -->
    <circle cx="36" cy="38" r="10" fill="#15110d" />
    <path d="M26,48 C26,42 46,42 46,48 L48,105 L38,105 L36,75 L32,105 L24,105 Z" fill="#15110d" />

    <!-- Person 2 (Slightly Shorter, Leaning Close - Right) -->
    <circle cx="56" cy="42" r="9" fill="#15110d" />
    <path d="M48,50 C48,44 64,44 64,50 L68,103 L60,103 L55,75 L50,103 L44,103 Z" fill="#15110d" />
    <!-- Flowing Shawl / Dupatta Silhouette -->
    <path d="M46,55 Q60,70 68,85 Q62,88 48,65 Z" fill="#1b1410" />

    <!-- Wide Vintage Umbrella -->
    <path d="M5,22 C15,-8 75,-8 85,22 C65,18 55,18 45,22 C35,18 25,18 5,22 Z" fill="#18130f" stroke="#3d3025" stroke-width="1.5" />
    <path d="M45,22 L45,60 C45,65 40,68 36,65" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="-8" x2="45" y2="-13" stroke="#2a2018" stroke-width="2" />
  </g>

  <!-- Gentle Atmospheric Rain Streaks -->
  <g stroke="#8ba5b5" stroke-width="0.8" opacity="0.32" stroke-linecap="round">
    <line x1="60" y1="40" x2="35" y2="130" />
    <line x1="140" y1="20" x2="115" y2="110" />
    <line x1="210" y1="60" x2="185" y2="150" />
    <line x1="280" y1="30" x2="255" y2="120" />
    <line x1="480" y1="50" x2="455" y2="140" />
    <line x1="560" y1="20" x2="535" y2="110" />
    <line x1="640" y1="70" x2="615" y2="160" />
    <line x1="720" y1="30" x2="695" y2="120" />
    <line x1="810" y1="50" x2="785" y2="140" />
    <line x1="880" y1="20" x2="855" y2="110" />

    <!-- Mid Rain Layers -->
    <line x1="110" y1="200" x2="85" y2="300" />
    <line x1="230" y1="180" x2="205" y2="280" />
    <line x1="670" y1="190" x2="645" y2="290" />
    <line x1="790" y1="170" x2="765" y2="270" />
    <line x1="180" y1="360" x2="155" y2="470" />
    <line x1="740" y1="350" x2="715" y2="460" />
  </g>

  <!-- Puddle Water Ripple Rings -->
  <g stroke="#d4af37" stroke-width="0.7" fill="none" opacity="0.3">
    <ellipse cx="220" cy="460" rx="20" ry="4" />
    <ellipse cx="220" cy="460" rx="35" ry="7" />
    <ellipse cx="680" cy="490" rx="25" ry="5" />
    <ellipse cx="680" cy="490" rx="42" ry="8" />
  </g>

  <!-- Vintage Film Grain & Texture Layers -->
  <rect width="900" height="600" fill="url(#grain_mc001)" />
  <rect width="900" height="600" fill="url(#scratches_mc001)" />

  <!-- Outer Classic Postcard Border -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5" rx="6" />
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="8 4" opacity="0.35" rx="4" />

  <!-- Corner Filigrees -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M42,65 L42,42 L65,42 M48,48 L58,48 M48,48 L48,58" />
    <path d="M858,65 L858,42 L835,42 M852,48 L842,48 M852,48 L852,58" />
    <path d="M42,535 L42,558 L65,558 M48,552 L58,552 M48,552 L48,542" />
    <path d="M858,535 L858,558 L835,558 M852,552 L842,552 M852,552 L852,542" />
  </g>

  <!-- Authentic Vintage Postmark / Stamp (Top Right) -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="84" height="102" fill="#1b1612" stroke="#d4af37" stroke-width="1.5" rx="2" opacity="0.9" />
    <rect x="6" y="6" width="72" height="90" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
    <text x="42" y="24" text-anchor="middle" font-family="'Cinzel', serif" font-size="8" fill="#d4af37" letter-spacing="1">MAGIC CARD</text>
    <circle cx="42" cy="52" r="16" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8" />
    <!-- Umbrella Silhouette Inside Stamp -->
    <path d="M30,52 C33,43 51,43 54,52 Z" fill="#d4af37" opacity="0.75" />
    <line x1="42" y1="52" x2="42" y2="60" stroke="#d4af37" stroke-width="1.2" />
    <text x="42" y="82" text-anchor="middle" font-family="'Special Elite', monospace" font-size="10" font-weight="bold" fill="#f8edd6">1954</text>
    <text x="42" y="93" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#c2a77a">DHAKA GPO</text>
    <!-- Cancellation Wave Lines Across Stamp -->
    <path d="M-25,25 Q-10,15 5,25 T35,25 T65,25 T95,25" fill="none" stroke="#221914" stroke-width="1.8" opacity="0.7" />
    <path d="M-25,45 Q-10,35 5,45 T35,45 T65,45 T95,45" fill="none" stroke="#221914" stroke-width="1.8" opacity="0.7" />
    <path d="M-25,65 Q-10,55 5,65 T35,65 T65,65 T95,65" fill="none" stroke="#221914" stroke-width="1.8" opacity="0.7" />
  </g>
</svg>
